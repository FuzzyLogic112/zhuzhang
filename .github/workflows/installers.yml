name: Build installers
on:
  push:
    branches: [main, 'feature/app-1.2.0']
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'offline/**'
      - 'app/**'
      - 'lib/**'
      - 'server/zip.ts'
      - 'package*.json'
      - 'scripts/**'
      - 'test-fixtures/**'
      - '.github/workflows/installers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            name: windows-x64
          - os: ubuntu-24.04
            target: --linux --x64
            name: linux-x64
          - os: macos-latest
            target: --mac --arm64
            name: mac-arm64
          - os: macos-latest
            target: --mac --x64
            name: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:apps
      - run: node scripts/test-pdf.mjs
      - run: npm ci
        working-directory: desktop
      - run: node scripts/prepare-ocr.mjs
      - run: node scripts/test-ocr.cjs
      - run: npm run dist -- ${{ matrix.target }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/test-packaged-ocr.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run typecheck && npm test && npm run build:apps
      - run: gradle --no-daemon :app:assembleRelease :app:lintRelease
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-for-private-signing
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*-unsigned.apk
  publish:
    needs: [desktop, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: installer-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers-output
          merge-multiple: true
      - name: Publish preview installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installers-output
          sha256sum * > SHA256SUMS-desktop.txt
          cd ..
          gh release view v1.2.0 >/dev/null 2>&1 || gh release create v1.2.0 --target "$GITHUB_SHA" --title "筑账 1.2.0 · 多端预览版" --prerelease --notes-file INSTALL.md
          gh release upload v1.2.0 installers-output/* --clobber
