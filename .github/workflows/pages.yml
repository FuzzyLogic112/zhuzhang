name: Publish Zhuzhang
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run typecheck && npm test && npm run build
      - name: Wait for complete tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const v=JSON.parse(fs.readFileSync('package.json')).version;
          const names=['android.apk','win-x64.exe','linux-x64.AppImage','linux-x64.deb','mac-arm64.dmg','mac-arm64.zip','mac-x64.dmg','mac-x64.zip'].map(s=>'zhuzhang-'+v+'-'+s);
          for(let n=0;n<120;n++){
            const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/releases/tags/v'+v,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN}});
            if(r.ok){const release=await r.json();if(names.every(name=>release.assets.some(a=>a.name===name&&a.state==='uploaded'&&a.size>0))){console.log('All tested installers are available');break;}}
            else if(r.status!==404)throw Error('Cannot check release: HTTP '+r.status);
            if(n===119)throw Error('Release is incomplete; download page was not deployed');
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v5
        id: deployment
